<!doctype html>
<html>
    <head>
        <title>Drone</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/mystyle.css') }}"> 
    </head>

    <script src="{{url_for('static', filename='serverCommunication.js')}}"></script>
    <script src="{{url_for('static', filename='timer.js')}}"></script>
    <body>
        <div id="log"></div>
        <br>

        <div class="container">

            <div class="button-container">
                <div class="base-timer">
                    <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <g class="base-timer__circle">
                        <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                        <path
                                id="base-timer-path-remaining"
                                stroke-dasharray="283"
                                class="base-timer__path-remaining green"
                                d="
                                   M 50, 50
                                   m -45, 0
                                   a 45,45 0 1,0 90,0
                                   a 45,45 0 1,0 -90,0
                                   "
                                ></path>
                        </g>
                    </svg>
                    <span id="base-timer-label" class="base-timer__label">
                        0:00
                    </span>
                </div>
                <div class="score-container">
                    <div id="score">--</div>
                </div>
            </div>
            <div><button class="btn" onclick="sendMessage('move', 'forward');">Forward</button></div>
            <div class="button-container">
                <button class="btn" onclick="sendMessage('move', 'left');">Left</button>
                <button class="btn" onclick="sendMessage('move', 'right');">Right</button>
            </div>
            <div>
                <button class="btn" onclick="sendMessage('move', 'back');">Back</button>
            </div>
        </div>
        <div class="container">
            <div class="button-container2" id="btn2-container">
                <button class="btnTO" id="tolBtn" value="take off" onclick="sendMessage(this.value);">Take Off</button>
            </div>
        </div>
        <div id="customAlert" class="custom-alert">

            <div class="custom-alert-content">
                <p id="alertText"></p>
            </div>
        </div>
        <!-- The custom alert box -->
        <div id="failureAlert" class="failure-alert">

            <div class="failure-alert-content">
                <p id="failureText"></p>
            </div>

        </div>

        <!-- The survey alert box -->
        <div id="surveyModal" class="modal">
            <div class="modal-content">
                <p id="surveyText"></p>
            </div>
        </div>
    </body>
</html>
